name: Publish application release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string
      prerelease:
        description: "Mark this as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: application-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

          if [[ "$RELEASE_TAG" == *-* && "$PRERELEASE" != "true" ]]; then
            echo "A pre-release tag requires the pre-release option"
            exit 1
          fi

          if [[ "$RELEASE_TAG" != *-* && "$PRERELEASE" == "true" ]]; then
            echo "The pre-release option requires a tag such as v1.2.3-rc.1"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists"
            exit 1
          fi

      - name: Test and build release artifacts
        run: ./gradlew test bootJar :scraper:shadowJar --no-daemon

      - name: Verify executable JARs
        run: |
          java -Djarmode=tools -jar build/libs/grimoire.jar list-layers
          java -jar scraper/build/libs/grimoire-scraper.jar --help

      - name: Create checksums
        run: |
          (cd build/libs && sha256sum grimoire.jar > grimoire.jar.sha256)
          (cd scraper/build/libs && sha256sum grimoire-scraper.jar > grimoire-scraper.jar.sha256)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=semver,pattern={{major}},value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ ! inputs.prerelease }}

      - name: Build and publish web application image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release summary
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_version="${RELEASE_TAG#v}"

          {
            echo "## Executable JARs"
            echo
            echo "- Web application: \`grimoire.jar\`"
            echo "- Scraper: \`grimoire-scraper.jar\`"
            echo "- Runtime requirement: Java 26"
            echo
            echo "## Container image"
            echo
            echo '```bash'
            echo "docker pull $image_name:$image_version"
            echo '```'
            echo
            echo "Multi-platform image: \`linux/amd64\`, \`linux/arm64\`"
            echo
            echo "Digest: \`$IMAGE_DIGEST\`"
          } > release-summary.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          release_args=(
            "$RELEASE_TAG"
            "build/libs/grimoire.jar"
            "build/libs/grimoire.jar.sha256"
            "scraper/build/libs/grimoire-scraper.jar"
            "scraper/build/libs/grimoire-scraper.jar.sha256"
            --target "$GITHUB_SHA"
            --title "Grimoire $RELEASE_TAG"
            --generate-notes
            --notes-file release-summary.md
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
