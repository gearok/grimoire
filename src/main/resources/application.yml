server:
  port: ${PORT:8080}
  compression:
    enabled: true

spring:
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}
  jackson:
    default-property-inclusion: non_null
  mvc:
    static-path-pattern: /static/**
  thymeleaf:
    cache: false

elasticsearch:
  index: ${ELASTICSEARCH_INDEX:spells-v1}

seed:
  enabled: ${SEED_DATA_ENABLED:true}
