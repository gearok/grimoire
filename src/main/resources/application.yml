server:
  port: ${PORT:8080}
  compression:
    enabled: true

spring:
  data:
    elasticsearch:
      repositories:
        enabled: false
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
  messages:
    # Russian lives in the base bundle, so never fall back to the server's own locale.
    fallback-to-system-locale: false
  mvc:
    static-path-pattern: /static/**
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
  thymeleaf:
    cache: false

elasticsearch:
  spells-index: ${ELASTICSEARCH_INDEX:spells-v1}
  monsters-index: ${ELASTICSEARCH_MONSTERS_INDEX:monsters-v1}
