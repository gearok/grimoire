<!DOCTYPE html>
<html
    lang="ru"
    xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout :: page(${view.pageTitle}, 'monsters', ~{::main})}"
>
<body>
<main class="shell detail-shell">
    <form th:replace="~{fragments/search :: searchPanel(${searchForm}, false)}"></form>

    <a th:href="@{/monsters}" href="/monsters" class="back-link">← НАЗАД / ВЕСЬ БЕСТИАРИЙ</a>
    <div class="spell-detail">
        <div class="detail-heading">
            <div>
                <h1 th:text="${view.nameRu}">Гоблин</h1>
                <p class="english-name" th:text="${view.nameEn}">Goblin</p>
            </div>
            <span class="level-badge" th:text="|[ПО ${view.challengeLabel}]|">[ПО 1/4]</span>
        </div>

        <table class="facts-table"><tbody>
            <tr th:each="fact : ${view.facts}">
                <th class="width-min" th:text="${fact.label}">Факт</th>
                <td class="width-auto" th:text="${fact.value}">Значение</td>
            </tr>
        </tbody></table>

        <div class="monster-stats-layout">
            <div class="monster-stat-table-scroll monster-combat-stats">
                <table class="monster-stat-table">
                    <thead>
                    <tr>
                        <th th:each="stat : ${view.combatStats}" th:text="${stat.label}">КД</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td th:each="stat : ${view.combatStats}" th:text="${stat.value}">15</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="monster-stat-table-scroll monster-ability-stats">
                <table class="monster-stat-table">
                    <thead>
                    <tr>
                        <th th:each="stat : ${view.abilityStats}" th:text="${stat.label}">СИЛ</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td th:each="stat : ${view.abilityStats}" th:text="${stat.value}">10</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <hr>
        <div class="rules-text">
            <section th:each="section : ${view.sections}">
                <h2 th:text="${section.title}">Действия</h2>
                <p th:each="entry : ${section.entries}">
                    <strong th:if="${entry.name != null}" th:text="|${entry.name}. |">Название. </strong>
                    <span th:text="${entry.text}">Текст</span>
                </p>
            </section>
            <section th:if="${view.description != null}">
                <h2>Описание</h2>
                <p th:text="${view.description}">Описание</p>
            </section>
        </div>

        <div class="source-line">
            ИСТОЧНИК=<span th:text="${view.sourcesLabel}">MM14</span> /
            <a th:href="${view.sourceUrl}" href="#" target="_blank" rel="noopener noreferrer">
                страница-источник ↗
            </a>
        </div>
    </div>
</main>
</body>
</html>
