<!DOCTYPE html>
<html lang="ru" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, section, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
        name="htmx-config"
        content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true},{"code":"...","swap":false}]}'
    >
    <title th:text="${title}">Гримуар</title>
    <link rel="icon" type="image/png" sizes="400x400" th:href="@{/static/grimoire.png}" href="/static/grimoire.png">
    <link th:each="alternate : ${alternates}" rel="alternate" th:hreflang="${alternate.key}" th:href="${alternate.value.url}">
    <script>
        (() => {
            const systemTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            try {
                const savedTheme = localStorage.getItem("grimoire-theme");
                document.documentElement.dataset.theme =
                    savedTheme === "dark" || savedTheme === "light" ? savedTheme : systemTheme;
            } catch (_) {
                document.documentElement.dataset.theme = systemTheme;
            }
        })();
    </script>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/owickstrom/the-monospace-web@6992b7c1a9051bbf969fc491c1af775a36d59449/src/reset.css"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/owickstrom/the-monospace-web@6992b7c1a9051bbf969fc491c1af775a36d59449/src/index.css"
    >
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
    >
    <link rel="stylesheet" th:href="@{/static/style.css}" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.8" crossorigin="anonymous"></script>
</head>
<body hx-boost="true" th:with="languagePrefix=${#locale.language == 'ru'} ? '' : '/' + ${#locale.language}">
    <header class="site-header">
        <table class="header">
            <tbody>
                <tr>
                    <td colspan="2" rowspan="2" class="width-auto">
                        <a th:href="@{/spells}" href="/spells" class="brand">
                            <h1 class="title" th:text="#{site.name}">Гримуар</h1>
                        </a>
                        <div class="header-switches">
                            <nav class="section-switch" aria-label="Раздел" th:aria-label="#{header.sections}">
                                <span>[</span>
                                <a
                                    th:text="#{header.spells}"
                                    th:href="@{/spells}"
                                    href="/spells"
                                    th:classappend="${section == 'spells'} ? 'active'"
                                >КНИГА ЗАКЛИНАНИЙ</a>
                                <span>/</span>
                                <a
                                    th:text="#{header.monsters}"
                                    th:href="@{/monsters}"
                                    href="/monsters"
                                    th:classappend="${section == 'monsters'} ? 'active'"
                                >БЕСТИАРИЙ</a>
                                <span>/</span>
                                <a
                                    th:text="#{header.classes}"
                                    th:href="@{${languagePrefix} + '/classes'}"
                                    href="/classes"
                                    th:classappend="${section == 'classes'} ? 'active'"
                                >КЛАССЫ</a>
                                <span>/</span>
                                <a
                                    th:text="#{header.races}"
                                    th:href="@{/races}"
                                    href="/races"
                                    th:classappend="${section == 'races'} ? 'active'"
                                >РАСЫ</a>
                                <span>]</span>
                            </nav>
                            <nav class="section-switch language-switch" aria-label="Язык" th:aria-label="#{header.language}">
                                <span>[</span>
                                <th:block th:each="language, languages : ${ {'ru', 'en'} }">
                                    <span th:unless="${languages.first}">/</span>
                                    <span
                                        th:if="${language == #locale.language}"
                                        class="active"
                                        aria-current="true"
                                        th:text="${#strings.toUpperCase(language)}"
                                    >RU</span>
                                    <a
                                        th:if="${language != #locale.language and alternates?.get(language) != null}"
                                        th:href="${alternates.get(language).href}"
                                        th:hreflang="${language}"
                                        th:lang="${language}"
                                        th:text="${#strings.toUpperCase(language)}"
                                    >EN</a>
                                    <span
                                        th:if="${language != #locale.language and alternates?.get(language) == null}"
                                        class="unavailable"
                                        th:title="#{header.language.unavailable}"
                                        th:text="${#strings.toUpperCase(language)}"
                                    >EN</span>
                                </th:block>
                                <span>]</span>
                            </nav>
                        </div>
                    </td>
                    <th class="width-min" th:text="#{header.edition}">Редакция</th>
                    <td class="width-min">5e/2014</td>
                </tr>
                <tr>
                    <th class="width-min theme-label" th:text="#{header.theme}">Тема</th>
                    <td class="width-min theme-cell">
                        <button
                            type="button"
                            class="theme-toggle"
                            data-theme-toggle
                            th:data-label-enable-light="#{theme.enable-light}"
                            th:data-label-enable-dark="#{theme.enable-dark}"
                            th:data-label-light="#{theme.light}"
                            th:data-label-dark="#{theme.dark}"
                        >
                            <span
                                class="material-icons-outlined"
                                aria-hidden="true"
                                data-theme-icon
                            >wb_sunny</span>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </header>

    <th:block th:replace="${content}"/>
    <footer class="site-footer">
        <span><th:block th:text="#{footer.made-by}">Сделано</th:block> <a
            href="https://github.com/gearok"
            target="_blank"
            rel="noopener noreferrer"
        >@gearok</a></span>
        <span aria-hidden="true"> / </span>
        <a
            href="https://github.com/HermanShpryhau/grimoire"
            target="_blank"
            rel="noopener noreferrer"
        >GitHub</a>
    </footer>
    <script th:src="@{/static/multi-select.js}" src="/static/multi-select.js"></script>
    <script th:src="@{/static/filter-panel.js}" src="/static/filter-panel.js"></script>
    <script th:src="@{/static/spell-suggestions.js}" src="/static/spell-suggestions.js"></script>
    <script th:src="@{/static/theme.js}" src="/static/theme.js"></script>
</body>
</html>
