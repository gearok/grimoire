<!DOCTYPE html>
<html
    lang="ru"
    xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout :: page('Заклинания', ~{::main})}"
>
<body>
<main class="shell">
    <h2>Фильтры</h2>
    <form
        th:action="@{/spells}"
        action="/spells"
        method="get"
        class="search-panel"
        hx-get="/spells"
        hx-target="#spell-results"
        hx-push-url="true"
        hx-trigger="submit, input changed delay:300ms from:#query, change from:.filter-option"
    >
        <div class="query-field">
            <label for="query">Название или текст</label>
            <input
                id="query"
                type="search"
                name="q"
                th:value="${view.query}"
                placeholder="Например, огненный шар…"
                autocomplete="off"
            >
        </div>
        <div th:replace="~{fragments/multi-select :: multiSelect(
            'level', 'level', 'Уровни', ${view.levels}, 'Все уровни'
        )}"></div>
        <div th:replace="~{fragments/multi-select :: multiSelect(
            'school', 'school', 'Школы', ${view.schools}, 'Все школы'
        )}"></div>
        <div th:replace="~{fragments/multi-select :: multiSelect(
            'class', 'class', 'Классы', ${view.characterClasses}, 'Все классы'
        )}"></div>
        <button type="submit">Найти</button>
    </form>

    <div id="spell-results">
        <div th:replace="~{spells/results :: results(${view})}"></div>
    </div>
</main>
</body>
</html>
