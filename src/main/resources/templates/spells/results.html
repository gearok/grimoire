<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="results(view)">
    <div class="results-heading">
        <h2 th:text="|Результаты / ${view.total}|">Результаты / 0</h2>
        <a
            th:if="${view.hasFilters}"
            th:href="@{/spells}"
            href="/spells"
            class="clear-link"
        >Сбросить фильтры</a>
    </div>

    <div class="empty-state" th:if="${view.spells.isEmpty()}">
        <h2>Ничего не найдено</h2>
        <p>Попробуйте убрать один из фильтров или изменить запрос.</p>
    </div>

    <div class="spell-grid" th:unless="${view.spells.isEmpty()}">
        <a
            th:each="spell : ${view.spells}"
            th:href="@{/spells/{id}(id=${spell.id})}"
            href="/spells/205"
            class="spell-card"
        >
            <div class="card-topline">
                <span class="level-badge" th:text="|[${spell.levelLabel}]|">[3 уровень]</span>
                <span class="school-name" th:text="${#strings.toUpperCase(spell.schoolName)}">ВОПЛОЩЕНИЕ</span>
            </div>
            <h2 th:text="${spell.nameRu}">Огненный шар</h2>
            <p class="english-name" th:text="${spell.nameEn}">Fireball</p>
            <p class="card-description" th:text="${spell.description}">Описание</p>
            <div class="card-meta">
                <span th:text="|ВРЕМЯ=${spell.castingTime}|">ВРЕМЯ=1 действие</span>
                <span th:if="${spell.concentration}">КОНЦЕНТРАЦИЯ</span>
                <span th:if="${spell.ritual}">РИТУАЛ</span>
            </div>
        </a>
    </div>

    <div class="pagination" th:if="${view.pageLabel != null}">
        <a
            th:if="${view.previousUrl != null}"
            th:href="${view.previousUrl}"
            th:attr="hx-get=${view.previousUrl}"
            hx-target="#spell-results"
            hx-push-url="true"
        >← Назад</a>
        <span th:text="${view.pageLabel}">Страница 1</span>
        <a
            th:if="${view.nextUrl != null}"
            th:href="${view.nextUrl}"
            th:attr="hx-get=${view.nextUrl}"
            hx-target="#spell-results"
            hx-push-url="true"
        >Вперёд →</a>
    </div>
</th:block>
