<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="results(view)">
    <input
        id="spell-result-mode"
        type="hidden"
        name="view"
        th:value="${view.resultMode.queryValue}"
        value="index"
        form="spell-filters"
    >
    <div class="results-heading">
        <h2 th:text="|Результаты / ${view.total}|">Результаты / 0</h2>
        <a
            th:if="${view.hasFilters}"
            th:href="@{/spells}"
            href="/spells"
            class="clear-link"
            hx-boost="true"
            hx-target="body"
            hx-push-url="true"
        >Сбросить фильтры</a>
    </div>

    <div class="empty-state" th:if="${!view.hasResults}">
        <h2>Ничего не найдено</h2>
        <p>Попробуйте убрать один из фильтров или изменить запрос.</p>
    </div>

    <div
        class="spell-link-index"
        th:if="${!view.cardsView && view.hasResults}"
    >
        <section
            class="spell-link-group"
            th:each="group : ${view.spellGroups}"
            th:attr="aria-labelledby=|spell-group-${group.initial}|"
        >
            <h2
                th:id="|spell-group-${group.initial}|"
                th:text="${group.initial}"
            >А</h2>
            <ul>
                <li th:each="spell : ${group.spells}">
                    <a
                        th:href="@{/spells/{id}(id=${spell.id})}"
                        href="/spells/205"
                    >
                        <span class="spell-link-main">
                            <span
                                class="spell-link-level"
                                th:text="${spell.level}"
                            >3</span>
                            <span th:text="${spell.nameRu}">Огненный шар</span>
                        </span>
                        <span
                            class="spell-link-school"
                            th:text="${spell.schoolName}"
                        >Воплощение</span>
                    </a>
                </li>
            </ul>
        </section>
    </div>

    <div
        class="spell-grid"
        th:if="${view.cardsView && view.hasResults}"
    >
        <a
            th:each="spell : ${view.spells}"
            th:href="@{/spells/{id}(id=${spell.id})}"
            href="/spells/205"
            class="spell-card"
        >
            <div class="card-heading">
                <h2 th:text="${spell.nameRu}">Огненный шар</h2>
                <span class="level-badge" th:text="|[${spell.levelLabel}]|">[3 уровень]</span>
            </div>
            <p class="english-name" th:text="${spell.nameEn}">Fireball</p>
            <p class="card-description" th:text="${spell.description}">Описание</p>
            <div class="card-meta">
                <span th:text="${#strings.toUpperCase(spell.schoolName)}">ВОПЛОЩЕНИЕ</span>
                <span th:text="|ВРЕМЯ=${spell.castingTime}|">ВРЕМЯ=1 действие</span>
                <span th:if="${spell.concentration}">КОНЦЕНТРАЦИЯ</span>
                <span th:if="${spell.ritual}">РИТУАЛ</span>
            </div>
        </a>
    </div>

    <div th:replace="~{fragments/search :: pagination(${view.pagination}, '#spell-results')}"></div>
</th:block>
